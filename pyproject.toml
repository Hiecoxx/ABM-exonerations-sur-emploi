[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abm-rgdu"
version = "1.5.0"
description = "Agent-based model of the RGDU 2026, automation and employment: 120 firms, two tasks, four wage bands, four markets."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["abm_rgdu"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
